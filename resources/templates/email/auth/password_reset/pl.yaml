subject: "Reset hasła"
bodyText: |
  Witaj!

  Otrzymaliśmy prośbę o zresetowanie hasła do Twojego konta.

  Twój kod resetowania hasła to: {{ code }}

  Kliknij poniższy link, aby ustawić nowe hasło:
  {{ link }}

  Kod jest ważny przez 1 godzinę. Jeśli nie prosiłeś o reset hasła, zignoruj tę wiadomość.
bodyHtml: |
  <p>Witaj!</p>
  <p>Otrzymaliśmy prośbę o zresetowanie hasła do Twojego konta.</p>
  <p>Twój kod resetowania hasła to: <strong>{{ code }}</strong></p>
  <p><a href="{{ link }}" style="display:inline-block;padding:10px 20px;background:#1a56db;color:#fff;text-decoration:none;border-radius:4px;">Ustaw nowe hasło</a></p>
  <p style="color:#6b7280;font-size:13px;">Kod jest ważny przez 1 godzinę. Jeśli nie prosiłeś o reset hasła, zignoruj tę wiadomość.</p>
