subject: "Aktywacja konta"
bodyText: |
  Witaj!

  Twój kod aktywacyjny to: {{ code }}

  Kliknij poniższy link, aby aktywować swoje konto:
  {{ link }}

  Kod jest ważny przez 24 godziny.
bodyHtml: |
  <p>Witaj!</p>
  <p>Twój kod aktywacyjny to: <strong>{{ code }}</strong></p>
  <p><a href="{{ link }}" style="display:inline-block;padding:10px 20px;background:#1a56db;color:#fff;text-decoration:none;border-radius:4px;">Aktywuj konto</a></p>
  <p style="color:#6b7280;font-size:13px;">Kod jest ważny przez 24 godziny. Jeśli nie zakładałeś konta, zignoruj tę wiadomość.</p>
